{% set name = "jpterm" %}
{% set version = "0.3.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bdf6054728869f1ace568e7ede41642e5d1191877fdf57eb15cf4d076ac3aa7d

build:
  noarch: python
  number: 0
  entry_points:
    - jpterm = jpterm.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
  run:
    - python >=3.10
    - rich-click >=1.6.0
    - txl =0.3.2
    - txl-cell =0.3.6
    - txl-console =0.3.6
    - txl-editors =0.3.6
    - txl-file-browser =0.3.6
    - txl-image-viewer =0.3.6
    - txl-jpterm =0.3.6
    - txl-kernel =0.3.6
    - txl-local-contents =0.3.6
    - txl-local-terminals =0.3.6
    - txl-local-kernels =0.3.6
    - txl-notebook-editor =0.3.6
    - txl-remote-contents =0.3.6
    - txl-remote-terminals =0.3.6
    - txl-remote-kernels =0.3.6
    - txl-text-editor =0.3.6
    - txl-markdown-viewer =0.3.6
    - txl-terminal =0.3.6
    - txl-launcher =0.3.6
    - txl-widgets =0.3.6

test:
  requires:
    - pip
  commands:
    - pip check
    - jpterm --help
  imports:
    - jpterm

about:
  home: https://github.com/davidbrochart/jpterm
  summary: Jupyter in the terminal
  dev_url: https://github.com/davidbrochart/jpterm
  license_file: LICENSE
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
